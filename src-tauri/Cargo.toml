[package]
name = "yf-download"
version = "0.1.0"
description = "YF Download Manager - Core Engine and Desktop App"
authors = ["Youssef <youssef@example.com>"]
edition = "2024"
license = "MIT"
default-run = "yf-download"

[lib]
name = "yf_download_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yf-download"
path = "src/main.rs"

[[bin]]
name = "yf-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
url = "2"
percent-encoding = "2"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
